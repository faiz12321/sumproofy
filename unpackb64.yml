name: unpackb64
on:
  workflow_dispatch:
  push:
    paths:
      - 'bundle.b64'
      - '*-bundle.b64'
permissions:
  contents: write
  actions: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          BUNDLE=$(ls | grep -E '(^|-)bundle\.b64$' | head -1)
          echo "bundle file: $BUNDLE"
          base64 -d "$BUNDLE" > /tmp/b.zip
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name bundle.b64 ! -name '*-bundle.b64' -exec rm -rf {} +
          unzip -o /tmp/b.zip
          git rm -q --cached "$BUNDLE" || true
          rm -f "$BUNDLE"
          git config user.name "SumProofy CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A -- . ':!.github'
          git commit -m "Add project files" || true
          git push
