name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v1.0.0"
        required: true
permissions:
  contents: write
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the full test suite
        run: python -m unittest discover -s tests -v

  build-exe:
    runs-on: windows-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller==6.22.3
      - name: Build the exe
        run: pyinstaller --onefile --name sumproofy --add-data "sumproofy/ui.html;sumproofy" run.py
      - name: Smoke test the exe
        shell: bash
        run: |
          ./dist/sumproofy.exe --no-browser --no-picker --port 8765 --token smoketoken &
          echo "--- wait for the app to come up"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS -H "X-Token: smoketoken" http://127.0.0.1:8765/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = "1" ] || { echo "app did not start"; exit 1; }
          echo "--- health with token"
          curl -fsS -H "X-Token: smoketoken" http://127.0.0.1:8765/api/health
          echo
          echo "--- health without token (expect 403)"
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8765/api/health)
          [ "$code" = "403" ] || { echo "expected 403, got $code"; taskkill //IM sumproofy.exe //F || true; exit 1; }
          echo "--- home page contains the token"
          curl -fsS http://127.0.0.1:8765/ | grep -q smoketoken || { echo "page missing token"; taskkill //IM sumproofy.exe //F || true; exit 1; }
          echo "--- real file check end to end"
          mkdir -p /c/tmp && printf 'fake installer bytes' > /c/tmp/f.bin
          out=$(curl -fsS -X POST -H "X-Token: smoketoken" -H "Content-Type: application/json" \
            --data '{"path": "C:\\tmp\\f.bin", "page_url": ""}' http://127.0.0.1:8765/api/check)
          echo "$out"
          echo "$out" | grep -q 'fef6689acd9011dc45034ad2bc7570f06536086f220cd9aacbfba73170814cc9' \
            || { echo "hash mismatch in end-to-end check"; taskkill //IM sumproofy.exe //F || true; exit 1; }
          taskkill //IM sumproofy.exe //F || true
      - uses: actions/upload-artifact@v4
        with:
          name: sumproofy-exe
          path: dist/sumproofy.exe

  release:
    needs: build-exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sumproofy-exe
      - name: Tag and release
        run: |
          TAG="${{ github.event.inputs.version }}"
          sha256sum sumproofy.exe | awk '{print $1}' > sumproofy.exe.sha256.txt
          git config user.name "SumProofy CI"
          git config user.email "ci@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "SumProofy $TAG" --notes "First public release. Early prototype: the exe is not signed, so Windows SmartScreen may warn on first run - see the Download and run section in README. sumproofy.exe.sha256.txt holds the SHA-256 fingerprint of the exe." sumproofy.exe sumproofy.exe.sha256.txt
        env:
          GH_TOKEN: ${{ github.token }}
